<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קבינט ספק — טורבו חלקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* פלטה בהירה, רגועה — בהשראת ממשק Claude */
    --paper:#FAF9F6; --paper-dim:#F3F1EA;
    --ink:#232221; --ink-soft:#4B4844; --steel:#7A776F; --line:#E4E1D8;
    --orange:#CC7B5C; --orange-deep:#B35F42;
    --plate-yellow:#CC7B5C; --green:#3D8B5F; --red:#C1503F; --white:#FFFFFF;
    /* אותה פלטה בהירה, גם עבור מסך הכניסה (בלי ערכת כהה נפרדת) */
    --dark-bg:#FAF9F6; --dark-surface:#FFFFFF; --dark-surface-2:#F3F1EA;
    --dark-border:#E4E1D8; --dark-text:#232221; --dark-muted:#7A776F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Heebo', sans-serif; line-height:1.5;}
  h1,h2,h3{font-family:'Rubik', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  input, select, textarea, button{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--orange); outline-offset:2px;}

  .wrap{max-width:920px; margin:0 auto; padding:0 20px;}

  /* ============ מסך כניסה (כהה, מינימלי) ============ */
  .auth-screen{
    min-height:100vh; background:var(--dark-bg); color:var(--dark-text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center;
  }
  .auth-inner{width:100%; max-width:400px;}

  .brand-mark{
    width:52px; height:52px; margin:0 auto 32px;
    background:var(--orange); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Rubik', sans-serif; font-weight:800; font-size:1.3rem; color:var(--white);
  }

  .auth-inner h1{font-size:1.6rem; font-weight:700; margin-bottom:10px; line-height:1.3;}
  .auth-inner .lead{color:var(--dark-muted); font-size:0.96rem; margin-bottom:34px;}

  .entry-tagrow{position:relative; margin-bottom:10px;}
  .entry-tag{
    position:absolute; top:-34px; left:0;
    font-size:0.72rem; font-weight:700; color:var(--orange);
    border:1px solid rgba(255,122,26,0.45); background:rgba(255,122,26,0.08);
    border-radius:999px; padding:5px 12px;
  }

  .entry-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    border-radius:12px; padding:16px 18px; font-size:1rem; font-weight:700;
    cursor:pointer; transition:transform .12s, background .15s, border-color .15s;
    margin-bottom:12px;
  }
  .entry-btn:active{transform:scale(0.98);}
  .entry-google{
    background:var(--dark-surface-2); color:var(--dark-text);
    border:1px solid var(--dark-border);
  }
  .entry-google:hover{border-color:#3A3E46;}
  .google-g{
    width:19px; height:19px; flex-shrink:0;
  }
  .entry-email{
    background:transparent; color:var(--dark-text);
    border:1px solid var(--dark-border);
  }
  .entry-email:hover{border-color:#4A4F58;}

  .auth-footer{
    margin-top:26px; font-size:0.78rem; color:#6C7178; line-height:1.7;
  }
  .auth-footer a{text-decoration:underline; color:#8B9099;}

  /* טופס אימייל בתוך המסך הכהה */
  .email-panel{display:none; text-align:right;}
  .email-panel.show{display:block;}
  .back-link{
    background:none; border:none; color:var(--dark-muted); font-size:0.85rem;
    cursor:pointer; margin-bottom:18px; display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{color:var(--dark-text);}
  .dark-field{margin-bottom:12px;}
  .dark-field label{display:block; font-size:0.78rem; font-weight:600; color:var(--dark-muted); margin-bottom:6px;}
  .dark-field input{
    width:100%; border:1px solid var(--dark-border); border-radius:10px;
    padding:13px 14px; font-size:0.92rem; background:var(--dark-surface); color:var(--dark-text);
  }
  .dark-field input:focus{border-color:var(--orange);}
  .dark-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .btn-solid{
    width:100%; border:none; border-radius:10px; padding:14px 18px;
    font-weight:700; font-size:0.95rem; cursor:pointer; margin-top:6px;
    background:var(--orange); color:var(--white); transition:background .15s;
  }
  .btn-solid:hover{background:var(--orange-deep);}

  .dark-switch{text-align:center; margin-top:16px; font-size:0.84rem; color:var(--dark-muted);}
  .dark-switch button{background:none; border:none; color:var(--orange); font-weight:700; cursor:pointer; font-size:0.84rem;}

  .dark-error{
    background:rgba(193,80,63,0.1); color:var(--red); border-radius:10px;
    padding:10px 12px; font-size:0.84rem; margin-bottom:14px; display:none; text-align:right;
  }
  .dark-error.show{display:block;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--dark-surface-2); color:var(--dark-text); border:1px solid var(--dark-border);
    padding:11px 18px; border-radius:999px; font-size:0.85rem; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:100; box-shadow:0 8px 24px -10px rgba(35,34,33,0.25);
  }
  .toast.show{opacity:1;}

  /* ============ מסך אפליקציה (בהיר, קבינט) ============ */
  header{
    background:var(--ink); color:var(--paper);
    padding:18px 0; margin-bottom:36px;
  }
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:900; font-size:1.15rem;}
  .logo-mark{
    width:32px; height:32px; border-radius:8px; background:var(--plate-yellow); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:700; font-size:0.8rem;
    transform:rotate(-4deg);
  }
  header .tag{font-size:0.82rem; color:#AEB6C2;}

  main{padding-bottom:80px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; font-size:0.92rem; background:var(--paper);
  }
  .field input:focus, .field select:focus{border-color:var(--orange); background:var(--white);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; padding:12px 20px;
    font-weight:700; font-size:0.92rem; cursor:pointer; transition:all .15s; width:100%;
  }
  .btn-primary{background:var(--orange); color:var(--white);}
  .btn-primary:hover{background:var(--orange-deep);}
  .error-msg{
    background:rgba(214,69,69,0.1); color:var(--red); border-radius:8px;
    padding:10px 12px; font-size:0.84rem; margin-bottom:14px; display:none;
  }
  .error-msg.show{display:block;}

  .dash-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    margin-bottom:26px;
  }
  .dash-head h2{font-size:1.5rem; font-weight:800;}
  .dash-head .who{font-size:0.86rem; color:var(--steel);}
  .logout-btn{
    background:var(--paper-dim); border:1px solid var(--line); border-radius:8px;
    padding:9px 16px; font-size:0.84rem; font-weight:600; cursor:pointer;
  }
  .logout-btn:hover{border-color:var(--ink);}

  .panel{
    background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin-bottom:24px;
  }
  .panel h3{font-size:1.05rem; font-weight:700; margin-bottom:16px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){ .grid-2{grid-template-columns:1fr;} }

  .alt-row{display:flex; gap:8px; margin-bottom:8px;}
  .alt-row input{flex:1;}
  .alt-row button{
    background:var(--paper-dim); border:1px solid var(--line); border-radius:8px;
    width:38px; flex-shrink:0; font-size:1rem; cursor:pointer; color:var(--red);
  }
  .add-alt-btn{
    background:none; border:1px dashed var(--line); border-radius:8px;
    padding:9px; width:100%; font-size:0.84rem; color:var(--ink-soft); cursor:pointer; margin-top:4px;
  }
  .add-alt-btn:hover{border-color:var(--orange); color:var(--orange-deep);}

  .success-msg{
    background:rgba(46,158,91,0.12); color:var(--green); border-radius:8px;
    padding:10px 12px; font-size:0.84rem; margin-top:14px; display:none;
  }
  .success-msg.show{display:block;}

  .my-parts{list-style:none; display:flex; flex-direction:column; gap:10px;}
  .my-part{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; flex-wrap:wrap;
  }
  .my-part-info{display:flex; align-items:center; gap:12px;}
  .my-part-icon{
    width:38px; height:38px; border-radius:8px; background:var(--paper-dim);
    display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  }
  .my-part-name{font-weight:700; font-size:0.92rem;}
  .my-part-meta{font-size:0.78rem; color:var(--steel);}
  .my-part-price{font-family:'JetBrains Mono'; font-weight:700;}
  .del-part-btn{
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:7px 12px; font-size:0.78rem; color:var(--red); cursor:pointer;
  }
  .del-part-btn:hover{background:rgba(214,69,69,0.08); border-color:var(--red);}
  .empty-state{color:var(--steel); font-size:0.88rem; text-align:center; padding:20px 0;}
</style>
</head>
<body>

<!-- ============ מסך כניסה ============ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-inner">
    <div class="brand-mark">ט</div>
    <h1>ברוכים הבאים ל־טורבו חלקים</h1>
    <p class="lead">הצטרפו כספקים. התחילו לנהל את כרטיסי המוצר שלכם</p>

    <!-- כניסת בחירה -->
    <div id="entryChoice">
      <div class="entry-tagrow">
        <span class="entry-tag" id="lastUsedTag" style="display:none;">בפעם האחרונה</span>
      </div>
      <button type="button" class="entry-btn entry-google" id="googleEntryBtn">
        <svg class="google-g" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.5-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.6C29.5 35.9 26.9 36.8 24 36.8c-5.2 0-9.6-3.5-11.2-8.2l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.8-2.9 5.1-5.3 6.6l6.6 5.6C39.9 37.4 45 31.6 45 24c0-1.2-.1-2.5-.4-3.5z"/>
        </svg>
        המשך עם Google
      </button>
      <button type="button" class="entry-btn entry-email" id="emailEntryBtn">
        ✉️ המשך עם אימייל
      </button>
    </div>

    <!-- טופס אימייל -->
    <div class="email-panel" id="emailPanel">
      <button type="button" class="back-link" id="backToEntry">→ חזרה</button>
      <div class="dark-error" id="authError"></div>

      <form id="loginForm">
        <div class="dark-field"><label>אימייל</label><input type="email" id="loginEmail" required /></div>
        <div class="dark-field"><label>סיסמה</label><input type="password" id="loginPassword" required /></div>
        <button type="submit" class="btn-solid">התחברות</button>
      </form>

      <form id="registerForm" style="display:none;">
        <div class="dark-field"><label>שם העסק</label><input type="text" id="regName" required /></div>
        <div class="dark-grid-2">
          <div class="dark-field"><label>עיר</label><input type="text" id="regCity" required /></div>
          <div class="dark-field"><label>טלפון</label><input type="text" id="regPhone" required /></div>
        </div>
        <div class="dark-field"><label>וואטסאפ (לא חובה)</label><input type="text" id="regWhatsapp" placeholder="972501234567" /></div>
        <div class="dark-field"><label>אימייל</label><input type="email" id="regEmail" required /></div>
        <div class="dark-field"><label>סיסמה</label><input type="password" id="regPassword" minlength="6" required /></div>
        <button type="submit" class="btn-solid">יצירת כרטיס ספק</button>
      </form>

      <div class="dark-switch">
        <span id="switchText">עדיין אין לכם כרטיס ספק?</span>
        <button id="switchBtn" type="button">הרשמה כספק</button>
      </div>
    </div>

    <div class="auth-footer">
      בהמשך, אתם מסכימים ל<a href="#">תנאי השימוש</a><br>
      ול<a href="#">מדיניות הפרטיות</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ מסך האפליקציה (קבינט) ============ -->
<div id="appScreen" style="display:none;">
  <header>
    <div class="wrap">
      <div class="logo"><div class="logo-mark">ט״ח</div> טורבו חלקים</div>
      <div class="tag">קבינט ספק</div>
    </div>
  </header>

  <main class="wrap">
    <div class="dash-head">
      <div>
        <h2 id="dashSellerName">—</h2>
        <div class="who" id="dashSellerMeta">—</div>
      </div>
      <button class="logout-btn" id="logoutBtn">התנתקות</button>
    </div>

    <div class="panel">
      <h3>➕ יצירת כרטיס מוצר חדש</h3>
      <div class="error-msg" id="createError"></div>

      <form id="createPartForm">
        <div class="grid-2">
          <div class="field"><label>שם החלק</label><input type="text" id="partName" required /></div>
          <div class="field"><label>מק״ט</label><input type="text" id="partNo" class="mono" required /></div>
        </div>
        <div class="field"><label>תיאור / התאמה לרכב</label><input type="text" id="partSub" placeholder="לדוגמה: תואם טויוטה קורולה 2015–2022" /></div>
        <div class="grid-2">
          <div class="field">
            <label>קטגוריה</label>
            <select id="partCategory">
              <option value="brakes">בלמים</option>
              <option value="filters">מסננים</option>
              <option value="battery">מצברים</option>
              <option value="lights">תאורה</option>
              <option value="oil">שמנים</option>
              <option value="suspension">מתלים</option>
            </select>
          </div>
          <div class="field"><label>מחיר (₪)</label><input type="number" id="partPrice" min="0" step="1" required /></div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>זמינות</label>
            <select id="partStock">
              <option value="in">במלאי</option>
              <option value="low">מלאי נמוך</option>
            </select>
          </div>
          <div class="field"><label>אייקון (אימוג׳י)</label><input type="text" id="partIcon" value="🔧" maxlength="2" /></div>
        </div>

        <div class="field">
          <label>מספרים חלופיים (תואמים) — OEM ומקבילות</label>
          <div id="altRows"></div>
          <button type="button" class="add-alt-btn" id="addAltBtn">+ הוסף מספר חלופי</button>
        </div>

        <button type="submit" class="btn btn-primary">שמירת כרטיס מוצר</button>
        <div class="success-msg" id="createSuccess">הכרטיס נוצר בהצלחה ✓</div>
      </form>
    </div>

    <div class="panel">
      <h3>הכרטיסים שלי</h3>
      <ul class="my-parts" id="myParts"><li class="empty-state">טוען…</li></ul>
    </div>
  </main>
</div>

<script>
// כתובת ה-API: כשהדף מוגש על ידי השרת נשתמש בנתיב יחסי,
// וכשפותחים את הקובץ ישירות מהדיסק — בשרת המקומי.
const API_BASE = location.protocol.startsWith('http') ? '/api' : 'http://localhost:4000/api';

let token = localStorage.getItem('seller_token') || null;
let seller = null;

const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const entryChoice = document.getElementById('entryChoice');
const emailPanel = document.getElementById('emailPanel');
const googleEntryBtn = document.getElementById('googleEntryBtn');
const emailEntryBtn = document.getElementById('emailEntryBtn');
const backToEntry = document.getElementById('backToEntry');
const lastUsedTag = document.getElementById('lastUsedTag');
const toast = document.getElementById('toast');

const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const authError = document.getElementById('authError');
const switchBtn = document.getElementById('switchBtn');
const switchText = document.getElementById('switchText');

let mode = 'login';

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 2200);
}

// אם המשתמש כבר התחבר עם אימייל בעבר, נציג תגית "בפעם האחרונה"
if(localStorage.getItem('seller_last_method') === 'email'){
  lastUsedTag.style.display = 'inline-block';
}

googleEntryBtn.addEventListener('click', ()=>{
  showToast('התחברות עם Google תהיה זמינה בקרוב 🚧');
});

emailEntryBtn.addEventListener('click', ()=>{
  entryChoice.style.display = 'none';
  emailPanel.classList.add('show');
});

backToEntry.addEventListener('click', ()=>{
  emailPanel.classList.remove('show');
  entryChoice.style.display = 'block';
  clearAuthError();
});

function showAuthError(msg){
  authError.textContent = msg;
  authError.classList.add('show');
}
function clearAuthError(){
  authError.classList.remove('show');
}

switchBtn.addEventListener('click', ()=>{
  mode = mode === 'login' ? 'register' : 'login';
  clearAuthError();
  if(mode === 'register'){
    loginForm.style.display = 'none';
    registerForm.style.display = 'block';
    switchText.textContent = 'כבר יש לכם כרטיס ספק?';
    switchBtn.textContent = 'התחברות';
  } else {
    loginForm.style.display = 'block';
    registerForm.style.display = 'none';
    switchText.textContent = 'עדיין אין לכם כרטיס ספק?';
    switchBtn.textContent = 'הרשמה כספק';
  }
});

async function apiFetch(path, options={}){
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    throw new Error(data.error || 'שגיאת שרת');
  }
  return data;
}

loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  clearAuthError();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try{
    const data = await apiFetch('/sellers/login', { method:'POST', body: JSON.stringify({ email, password }) });
    token = data.token;
    seller = data.seller;
    localStorage.setItem('seller_token', token);
    localStorage.setItem('seller_last_method', 'email');
    enterDashboard();
  }catch(err){
    showAuthError(err.message);
  }
});

registerForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  clearAuthError();
  const body = {
    name: document.getElementById('regName').value,
    city: document.getElementById('regCity').value,
    phone: document.getElementById('regPhone').value,
    whatsapp: document.getElementById('regWhatsapp').value || undefined,
    email: document.getElementById('regEmail').value,
    password: document.getElementById('regPassword').value,
  };
  try{
    const data = await apiFetch('/sellers/register', { method:'POST', body: JSON.stringify(body) });
    token = data.token;
    seller = data.seller;
    localStorage.setItem('seller_token', token);
    localStorage.setItem('seller_last_method', 'email');
    enterDashboard();
  }catch(err){
    showAuthError(err.message);
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  token = null; seller = null;
  localStorage.removeItem('seller_token');
  appScreen.style.display = 'none';
  authScreen.style.display = 'flex';
  emailPanel.classList.remove('show');
  entryChoice.style.display = 'block';
});

async function enterDashboard(){
  try{
    const data = await apiFetch('/sellers/me/profile');
    seller = data.seller;
  }catch(err){
    token = null;
    localStorage.removeItem('seller_token');
    return; // נשארים במסך הכניסה
  }
  authScreen.style.display = 'none';
  appScreen.style.display = 'block';
  document.getElementById('dashSellerName').textContent = seller.name;
  document.getElementById('dashSellerMeta').textContent = `${seller.city} · ${seller.email} ${seller.verified ? '· ✓ מאומת' : ''}`;
  loadMyParts();
}

/* --- יצירת כרטיס מוצר --- */
const altRows = document.getElementById('altRows');

function addAltRow(number='', brand=''){
  const row = document.createElement('div');
  row.className = 'alt-row';
  row.innerHTML = `
    <input type="text" class="alt-number mono" placeholder="מספר, למשל GDB3410" value="${number}">
    <input type="text" class="alt-brand" placeholder="יצרן (OEM / Bosch...)" value="${brand}" style="flex:0.7; border:1px solid var(--line); border-radius:8px; padding:0 10px;">
    <button type="button" title="הסר">✕</button>
  `;
  row.querySelector('button').addEventListener('click', ()=> row.remove());
  altRows.appendChild(row);
}
document.getElementById('addAltBtn').addEventListener('click', ()=> addAltRow());
addAltRow(); // שורה ראשונה כברירת מחדל

const createError = document.getElementById('createError');
const createSuccess = document.getElementById('createSuccess');

document.getElementById('createPartForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  createError.classList.remove('show');
  createSuccess.classList.remove('show');

  const interchange_numbers = Array.from(altRows.querySelectorAll('.alt-row')).map(row=>({
    number: row.querySelector('.alt-number').value.trim(),
    brand: row.querySelector('.alt-brand').value.trim(),
  })).filter(x=>x.number);

  const body = {
    name: document.getElementById('partName').value,
    part_no: document.getElementById('partNo').value,
    sub: document.getElementById('partSub').value,
    category: document.getElementById('partCategory').value,
    price: parseInt(document.getElementById('partPrice').value, 10),
    stock: document.getElementById('partStock').value,
    icon: document.getElementById('partIcon').value || '🔧',
    interchange_numbers,
  };

  try{
    await apiFetch('/sellers/me/parts', { method:'POST', body: JSON.stringify(body) });
    createSuccess.classList.add('show');
    e.target.reset();
    document.getElementById('partIcon').value = '🔧';
    altRows.innerHTML = '';
    addAltRow();
    loadMyParts();
  }catch(err){
    createError.textContent = err.message;
    createError.classList.add('show');
  }
});

/* --- רשימת הכרטיסים שלי --- */
const myPartsEl = document.getElementById('myParts');

async function loadMyParts(){
  myPartsEl.innerHTML = '<li class="empty-state">טוען…</li>';
  try{
    const data = await apiFetch('/sellers/me/parts');
    if(!data.parts.length){
      myPartsEl.innerHTML = '<li class="empty-state">עדיין לא יצרתם כרטיסי מוצר — התחילו למעלה ⬆️</li>';
      return;
    }
    myPartsEl.innerHTML = data.parts.map(p=>`
      <li class="my-part">
        <div class="my-part-info">
          <div class="my-part-icon">${p.icon || '🔧'}</div>
          <div>
            <div class="my-part-name">${p.name}</div>
            <div class="my-part-meta mono">מק״ט ${p.part_no} · ${p.interchange_numbers.length} מספרים חלופיים</div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="my-part-price">₪${p.price}</span>
          <button class="del-part-btn" data-id="${p.id}">מחיקה</button>
        </div>
      </li>
    `).join('');

    myPartsEl.querySelectorAll('.del-part-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('למחוק את הכרטיס הזה?')) return;
        try{
          await apiFetch(`/sellers/me/parts/${btn.dataset.id}`, { method:'DELETE' });
          loadMyParts();
        }catch(err){
          alert(err.message);
        }
      });
    });
  }catch(err){
    myPartsEl.innerHTML = `<li class="empty-state">שגיאה בטעינת הכרטיסים: ${err.message}</li>`;
  }
}

// אם יש טוקן שמור — ננסה להיכנס ישר לקבינט
if(token){
  enterDashboard();
}
</script>
