<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>
  /* מסך רחב מקבל את גרסת האתר, מסך צר את האפליקציה. ?ui=mobile נועל
     על הגרסה הזו, וגם אפליקציה שהותקנה למסך הבית נשארת כאן. */
  (function () {
    var forced = /[?&]ui=mobile/.test(location.search);
    var installed = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (!forced && !installed && innerWidth >= 1024) location.replace('/desktop' + location.search);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efece8">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="autoparts">
<!-- מסך מלא אחרי "הוסף למסך הבית"; black-translucent מותח את הרקע הקרמי
     גם מתחת לשעון, ועל ה-safe area מפצה ה-CSS למטה -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>autoparts — כל חלק. כל רכב.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='71%20180%20496%20333'%3E%3Cpath%20fill='%23dd6612'%20fill-rule='evenodd'%20d='M72%20180%20L72%20190%20L108%20365%20L129%20477%20L134%20489%20L147%20504%20L160%20511%20L168%20513%20L468%20513%20L476%20511%20L490%20503%20L502%20489%20L507%20476%20L535%20332%20L567%20182%20L566%20180%20Z%20M97%20202%20L138%20416%20L166%20351%20L225%20202%20Z%20M412%20202%20L474%20357%20L484%20378%20L485%20384%20L497%20410%20L498%20416%20L500%20415%20L541%20202%20Z%20M318%20245%20L273%20356%20L270%20360%20L269%20366%20L256%20394%20L250%20412%20L247%20416%20L243%20429%20L240%20433%20L232%20456%20L224%20472%20L218%20487%20L219%20489%20L418%20488%20L399%20440%20L315%20440%20L315%20436%20L322%20422%20L339%20377%20L372%20376%20L319%20245%20Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efece8; --card:#f7f5f2; --chip:#ece8e2; --ink:#16140f; --muted:#8b847b;
  --line:#e4dfd8; --hair:#d6cfc5; --orange:#dd6612;
  --orig-bg:#e2ecda; --orig-fg:#3c6a31;
  --copy-bg:#eae6df; --copy-fg:#5d574f;
  --used-bg:#fbe4cf; --used-fg:#a3560f;
  --sans:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:Rubik,Heebo,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --island:linear-gradient(165deg,#fdfcfb 0%,#e7e3dc 42%,#c9c5bd 74%,#eae6e0 100%);

  /* סולם טיפוגרפי: שישה גדלים, לא תשעה־עשר. כל טקסט בממשק
     בוחר אחד מהם — כך ההיררכיה נקראת ולא מתפרקת. */
  --fs-micro:10px;   /* חותמת על תמונה */
  --fs-label:11px;   /* תוויות, כיתובי עזר */
  --fs-sub:13px;     /* טקסט משני, תאי טבלה */
  --fs-body:15px;    /* טקסט ראשי, שם פריט */
  --fs-lead:20px;    /* כותרת מסך */
  --fs-hero:27px;    /* כותרת הבית */

  /* סולם מרווחים על בסיס 4: שמונה ערכים במקום עשרים ואחד */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:20px; --s6:24px; --s7:32px; --s8:40px;

  /* שטח נגיעה מינימלי — אצבע בשמן מנוע לא פוגעת ב-34 פיקסל */
  --tap:44px;
  /* המרווחים נגזרים מהמסך, המידות של הפקדים לא: אצבע לא גדלה עם
     המכשיר, ולכן שטח מגע נשאר 44 פיקסל בכל מסך. clamp שומר שהיחס
     לא יתפרק במסך קטן או ארוך במיוחד. */
  --gap-h:clamp(8px, 2.4vw, 14px);             /* אופקי — לפי רוחב המסך */
  --gap-v:clamp(7px, 1.15vh, 14px);            /* אנכי — לפי גובה המסך */
  --isle-gap:var(--gap-h);
  --dock-h:calc(var(--tap) + var(--s3) * 2);   /* גובה האי, נגזר משטח המגע */
  --isle-h:56px;                                /* גובה כפתור החיפוש */
  --dock-bottom:calc(var(--gap-v) + env(safe-area-inset-bottom));

  /* עקומה אחת לכל התנועה בממשק — קרובה לזו של iOS: יוצאת מהר,
     נעצרת רך, בלי קפיצה בסוף */
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
/* המסך עצמו לא זז: הגוף נעול למסך, ולכן אין גלילה של הדף ואין את
   הקפיצה של ספארי שחושפת רקע אפור מעל האפליקציה. גוללות רק הרשימות. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  /* הרקע קרמי כמו האפליקציה: בטלפון שורת הכתובת נעלמת ומופיעה,
     והפס שנחשף לרגע מתחת חייב להיות באותו צבע ולא אפור */
  position:fixed;inset:0;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  touch-action:manipulation;                 /* בלי זום בהקשה כפולה */
  -webkit-text-size-adjust:100%;
}
#app{
  width:100%;max-width:460px;background:var(--bg);
  height:100%;                    /* הגוף נעול למסך, ולכן 100% הוא בדיוק מה שנראה */
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:520px){
  body{background:#d9dadd}   /* מסגרת אפורה מסביב ל"מכשיר" רק במסך רחב */
  body{align-items:center;padding: var(--s6) 0}
  #app{height:min(880px,calc(100dvh - 44px));min-height:0;border-radius:38px;box-shadow:0 18px 44px rgba(22,20,15,.22)}
  .top{padding-top: var(--s5)}
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* בלי הבזק אפור של הדפדפן על הקשה — באפליקציה התגובה היא התנועה עצמה */
*{-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;flex:none;
     padding:calc(var(--s5) + env(safe-area-inset-top)) var(--s5) 0}
.brand{display:flex;align-items:center;gap: var(--s3);direction:ltr}
.brand b{font:600 var(--fs-sub)/1 var(--mono);letter-spacing:1.6px}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn{transition:background-color .22s var(--ease), transform .2s var(--ease)}
.iconbtn:active{background:var(--chip);transform:scale(.92)}

/* ---------- прокручиваемая область ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;touch-action:pan-y;
        padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.pad{padding:0 var(--s5)}

/* ---------- поиск ---------- */
.searchbar{background:var(--card);border-radius:999px;padding: var(--s4) var(--s5);display:flex;align-items:center;gap: var(--s3);box-shadow:0 6px 20px rgba(22,20,15,.07)}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:var(--fs-body);min-width:0}
.searchbar input::placeholder{color:var(--muted)}
/* כפתור אחד ברור בקצה השדה, במקום שני סמלים שנראים כמו אותו דבר */
.searchgo{
  flex:none;width:38px;height:38px;border-radius:999px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  margin-block:-6px;transition:transform .2s var(--ease), opacity .2s var(--ease);
}
.searchgo:active{transform:scale(.94);opacity:.9}

/* ---------- чипы ---------- */
.chips{display:flex;gap: var(--s2);flex-wrap:wrap}
.chip{min-height:40px;padding:0 var(--s4);border-radius:999px;background:var(--chip);
      font:500 var(--fs-label) var(--sans);white-space:nowrap;
      display:inline-flex;align-items:center;justify-content:center}
.chip{transition:background-color .26s var(--ease), color .26s var(--ease), transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.num{display:inline-block;padding: var(--s1) 9px;border-radius:999px;background:var(--chip);font:500 var(--fs-label) var(--mono);letter-spacing:.3px;color:#4f4941;direction:ltr}
/* מק״ט מקורי בולט משאר המספרים: הוא זה שמזהה את החלק */
.num.oem{background:#e7ecdf;color:#3f5730}
.tag{display:inline-block;padding: var(--s2) 11px;border-radius:999px;font:500 var(--fs-label) var(--sans)}
.tag.orig{background:var(--orig-bg);color:var(--orig-fg)}
.tag.copy{background:var(--copy-bg);color:var(--copy-fg)}
.tag.used{background:var(--used-bg);color:var(--used-fg)}

/* ---------- карточки ---------- */
.card{background:var(--card);border-radius:20px;overflow:hidden}
.thumb{border-radius:14px;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}
.price{font:600 var(--fs-body) var(--mono);direction:ltr}
.muted{color:var(--muted)}
.label{font:500 var(--fs-label) var(--sans);color:var(--muted)}
.hr{border-top:1px solid var(--line)}

/* ---------- нижний островной навбар ---------- */
.dock{position:absolute;bottom:var(--dock-bottom);inset-inline:0;
      display:flex;align-items:center;justify-content:center;gap: var(--s3);
      pointer-events:none;z-index:40;   /* מעל המסך, מתחת לפאנל שנפתח מעליו */
      transition:opacity .5s var(--ease)}
/* כשהפאנל למעלה, כפתור החיפוש שלו תופס את מקום האי — ואין טעם בשניהם */
.dock.under{opacity:0}
.dock.under *{pointer-events:none}
/* ---------- זכוכית ----------
   מה שנותן לחומר להיראות כמו זכוכית זה לא הטשטוש לבדו אלא הקצה:
   אור נתפס בשפה העליונה, מתעמעם באמצע וחוזר בתחתונה. הטבעת נצבעת
   בגרדיאנט וממוסכת לרוחב המסגרת בלבד, כך שהיא באמת קו ולא שכבה. */
.glass{
  /* טשטוש הוא הדבר היקר ביותר בפריים; רק מי שבאמת מראה מה שמאחוריו
     מקבל אותו, והשאר מקבלים את הטבעת בלבד (.rim) */
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
}
/* בלי מסכה הגרדיאנט היה מכסה את כל הכפתור בלבן במקום להיות קו,
   ולכן הטבעת נצבעת רק כשהדפדפן יודע לחתוך אותה */
@supports (mask-composite: exclude) or (-webkit-mask-composite: xor){
  .glass::after,.rim::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(150deg,
      rgba(255,255,255,.92) 0%, rgba(255,255,255,.30) 26%,
      rgba(255,255,255,0) 50%, rgba(255,255,255,.28) 74%, rgba(255,255,255,.80) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
}

.island{
  position:relative;display:flex;align-items:center;gap: var(--s1);
  border-radius:999px;padding: var(--s3) 12px;pointer-events:auto;
  background:rgba(247,245,242,.58);
  box-shadow:
    0 12px 34px rgba(22,20,15,.16),
    0 2px 8px rgba(22,20,15,.07),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -1px 0 rgba(255,255,255,.22),
    inset 0 0 0 1px rgba(255,255,255,.28);
}
/* דפדפן בלי טשטוש מקבל רקע אטום, אחרת האי היה שקוף ובלתי קריא */
@supports not (backdrop-filter:blur(1px)){
  .island{background:rgba(247,245,242,.94)}
  .fab{background:var(--ink)}
  .pulltab{background:var(--card)}
}

/* הגלולה מחליקה בין הלשוניות במקום לקפוץ — עדשה בהירה על הזכוכית */
/* העיגול גדול מהלשונית ויושב סביבה. הוא זז ב-transform ולא במרווח:
   התנועה רצה בכרטיס המסך ולא מחשבת פריסה מחדש בכל פריים. */
.tabpill{
  position:absolute;top:calc(var(--s3) - 5px);inset-inline-start:7px;
  width:calc(var(--tap) + 10px);height:calc(var(--tap) + 10px);border-radius:999px;
  background:rgba(255,255,255,.62);
  box-shadow:0 3px 10px rgba(22,20,15,.12), inset 0 1px 0 rgba(255,255,255,.8);
  will-change:transform;
  transition:transform .46s var(--ease);
}
.tabpill.dragging{transition:none}          /* בזמן גרירה העיגול על האצבע */
.island{touch-action:none}                  /* הגרירה שלנו, לא של הדפדפן */
.tab{
  position:relative;z-index:1;width:var(--tap);height:var(--tap);border-radius:999px;
  display:flex;align-items:center;justify-content:center;color:#6b655c;
  transition:color .28s var(--ease);
}
.tab[aria-current="page"]{color:var(--ink)}
/* אותה זכוכית בגוון כהה: הכפתור נשאר הפעולה הראשית וגם הוא חי
   מעל מה שמתחתיו במקום לשבת עליו כעיגול אטום */
.fab{
  position:relative;width:56px;height:56px;border-radius:999px;color:#fff;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  background:rgba(22,20,15,.82);
  box-shadow:
    0 12px 28px rgba(22,20,15,.34),
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -1px 0 rgba(255,255,255,.10),
    inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
@supports (mask-composite: exclude) or (-webkit-mask-composite: xor){
  .fab::after{
    background:linear-gradient(150deg,
      rgba(255,255,255,.70) 0%, rgba(255,255,255,.18) 30%,
      rgba(255,255,255,0) 54%, rgba(255,255,255,.16) 76%, rgba(255,255,255,.50) 100%);
  }
}
.fab:active{transform:scale(.9)}

/* הפילטר יושב בשורה אחת עם האי ועם כפתור ההוספה, בצד השני שלו:
   שלושה איים מאוזנים במקום שבב מרחף באמצע */
.circ{
  position:relative;width:var(--isle-h);height:var(--isle-h);border-radius:999px;
  color:var(--ink);pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  background:rgba(247,245,242,.58);
  box-shadow:
    0 10px 26px rgba(22,20,15,.14),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 0 0 1px rgba(255,255,255,.28);
  transition:transform .2s var(--ease);
}
.circ:active{transform:scale(.9)}
@supports not (backdrop-filter:blur(1px)){ .circ{background:rgba(247,245,242,.94)} }

/* ---------- формы ---------- */
.field{display:flex;flex-direction:column;gap: var(--s2)}
.field input,.field select,.field textarea{
  background:var(--card);border-radius:14px;padding: var(--s4) 16px;border:0;outline:none;width:100%;font-size:var(--fs-body);
}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--hair)}
.field .mono{font:500 var(--fs-sub) var(--mono);text-align:right}

/* תמונת המוצר בטופס: ריבוע שמראה את התמונה עצמה על רקע שקוף */
.photo{
  position:relative;width:96px;height:96px;flex:none;border-radius:16px;
  border:1px dashed #c9c2b8;background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap: var(--s2);color:var(--muted);text-align:center;
  background-size:contain;background-repeat:no-repeat;background-position:center;
}
.photo.has{border-style:solid;border-color:var(--hair)}
.photo-x{
  position:absolute;top:-8px;inset-inline-start:-8px;width:24px;height:24px;
  border-radius:999px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding: var(--s4);text-align:center;font:500 var(--fs-body) var(--sans);width:100%}
.btn{transition:opacity .2s var(--ease), transform .2s var(--ease)}
.btn:active{opacity:.9;transform:scale(.975)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--hair)}

/* ---------- чат ---------- */
.bubble{max-width:82%;padding: var(--s4) 15px;font:400 var(--fs-body)/1.6 var(--sans);border-radius:18px}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-end-end-radius:6px}
.bubble.them{align-self:flex-start;background:var(--card);border-end-start-radius:6px}
.time{font:400 var(--fs-micro) var(--mono);color:#b0a9a0}

/* ---------- служебное ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap: var(--s3);text-align:center;padding: var(--s8) 30px}
.spin{width:26px;height:26px;border:2.5px solid var(--hair);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:18px;background:var(--ink);color:#fff;border-radius:14px;padding: var(--s4) 16px;font:500 var(--fs-sub) var(--sans);z-index:50;box-shadow:0 10px 24px rgba(22,20,15,.3)}
.toast.err{background:#8c2f14}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
svg{flex:none}

@media (prefers-reduced-motion: reduce){
  .tabpill{transition:none}
}

/* ---------- מסך הבית: כותרת וחיפוש בלבד ---------- */
.home{touch-action:none;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
/* הזוג יושב מעט מעל השליש העליון: החלל מתחתיו גדול פי 2.5 מזה
   שמעליו. מרווחים גמישים שומרים על היחס בכל גובה מסך. */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:var(--s6);padding:0 var(--s6);text-align:center;
}
.hero::before{content:'';flex:2}
.hero::after {content:'';flex:5}
.hero .searchbar{width:100%}
.home input{touch-action:auto}   /* השדה נשאר שדה: סימון וסמן כרגיל */

/* ---------- הפאנל הנפתח ---------- */
.scrim{
  position:absolute;inset:0;z-index:42;background:rgba(22,20,15,.10);
  opacity:0;visibility:hidden;transition:opacity .4s var(--ease), visibility .4s;
}
.scrim.open{opacity:1;visibility:visible}
/* בטלפון ההצללה נצמדת למסך ולא לאפליקציה: אם הדפדפן מותיר רצועה
   מתחתיה (שורת כתובת שמתקפלת), היא נשארה בהירה כמו מדף מרחף */
@media (max-width:519px){ .scrim{position:fixed} }

/* הפאנל צף כאי בפני עצמו, ותחתיו אי נפרד עם כפתור החיפוש.
   שניהם יושבים במעטפת אחת שזזה כיחידה, ולכן הם עולים ויורדים יחד
   ושומרים ביניהם את אותו מרווח כמו מהשוליים. */
.sheetwrap{
  position:absolute;inset-inline:0;bottom:0;z-index:45;
  display:flex;flex-direction:column;justify-content:flex-end;gap: var(--gap-v);
  padding:0 var(--gap-h) calc(var(--dock-bottom) + (var(--dock-h) - var(--isle-h)) / 2);
  max-height:88%;
  /* סגור = מתחת לקצה ועוד קצת, כדי ששגיאת עיגול לא תשאיר פס מציץ */
  transform:translateY(calc(100% + 24px));will-change:transform, height;
  transition:transform .58s var(--ease), height .52s var(--ease);
  pointer-events:none;touch-action:none;
}
.sheetwrap > *{pointer-events:auto}
.sheetwrap.dragging{transition:none}      /* בזמן משיכה הפאנל הולך אחרי האצבע */

.sheet{
  min-height:clamp(260px, 46vh, 430px);display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border-radius:28px;
  /* הצל שייך לאי שנמצא על המסך; כשהוא למטה הוא לא מותיר סימן */
  box-shadow:none;transition:box-shadow .5s var(--ease);
}
.sheetwrap.open .sheet,.sheetwrap.dragging .sheet{box-shadow:0 14px 40px rgba(22,20,15,.20)}

.sheetscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
             display:flex;flex-direction:column;
             padding-bottom: var(--s5)}
.sheetscroll > .stack{flex:1;min-height:0}
/* הכותרת היא גם אזור המשיכה: משם מורידים את הפאנל חזרה */
.sheethead{
  flex:none;display:flex;flex-direction:column;align-items:center;gap: var(--s3);
  padding: var(--s3) var(--s5) var(--s4);
  touch-action:none;cursor:grab;
}
.sheethead:active{cursor:grabbing}
.sheethead .grab{width:38px;height:4px;border-radius:999px;background:var(--hair)}
.sheethead .row{width:100%}
.sheettitle{font:600 var(--fs-sub) var(--disp)}

/* שדה טקסט בתוך הפאנל — אותו משקל כמו הצ׳יפים שלידו */
.sheet .fieldline{
  background:var(--chip);border:0;outline:none;width:100%;
  border-radius:14px;padding: var(--s3) 14px;font-size:var(--fs-body);
}
.sheet .fieldline:focus{box-shadow:0 0 0 2px var(--hair)}
.sheet select[data-field]{
  background:var(--chip);border:0;outline:none;width:100%;
  border-radius:14px;padding: var(--s3) 14px;font-size:var(--fs-body);
}

/* כפתור החיפוש נשאר בהישג יד גם כשהרשימות ארוכות והפאנל נגלל */
/* האי התחתון של הפאנל: כפתור החיפוש עומד בפני עצמו, ולידו — רק
   כשיש מה לנקות — עיגול קטן. אותו מרווח כמו בין הפאנל לשוליים. */
.sheetbar{display:flex;align-items:center;gap: var(--gap-h)}
.sheetbar .btn.isle{
  flex:1;height:var(--isle-h);display:flex;align-items:center;justify-content:center;
  padding:0 var(--s5);border-radius:999px;
  box-shadow:0 10px 26px rgba(22,20,15,.24);
}
.isle-x{
  flex:none;width:var(--isle-h);height:var(--isle-h);border-radius:999px;
  background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(22,20,15,.14);
  transition:transform .2s var(--ease);
}
.isle-x:active{transform:scale(.92)}

/* ארבעת המדפים בעמוד הראשון של הפאנל */
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap: var(--s3);flex:1}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap: var(--s2);
  padding: var(--s4) 15px;border-radius:20px;background:var(--chip);
  text-align:start;min-height:104px;justify-content:flex-end;
  transition:transform .2s var(--ease), background-color .26s var(--ease);
}
.tile:active{transform:scale(.97);background:#e4dfd7}
.tile-i{color:var(--muted);margin-block-end:auto}
.tile-t{font:600 var(--fs-body) var(--disp)}
.tile-s{font:400 var(--fs-label) var(--sans);color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  .sheetwrap{transition:transform .01s}
  .scrim{transition:opacity .01s}
}

/* ---------- מסך פתיחה ----------
   מצויר ישירות ב-HTML כדי שייצבע לפני שה-JS בכלל נטען. בשרת שנרדם
   ההמתנה הראשונה ארוכה, ובלעדיו המשתמש רואה מסך לבן וחושב שנשבר.

   הרצף: הסימן נכנס לבדו במרכז, נעצר לרגע, ואז השם נפתח מאחוריו.
   השם גדל ברוחב בתוך מסגרת חתוכה, ומכיוון שהשורה ממורכזת הסימן
   נדחף שמאלה תוך כדי — כך זה נראה כאילו הוא זז והשם היה מתחתיו. */
#splash{
  position:absolute;inset:0;z-index:60;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s ease, visibility .5s;
}
#splash.gone{opacity:0;visibility:hidden}

/* הבמה: הסימן והשם עומדים על אותו קו רצפה, והגלגל נופל מעליהם.
   הכול נמדד בזמן אמת ומונע בסימולציה, ולא בקיפצוצים מוכנים מראש. */
#splash .stage{position:relative;display:flex;align-items:flex-end;direction:ltr;will-change:transform}
#splash .mark{
  width:84px;flex:none;display:block;
  transform-origin:50% 100%;   /* הצמיג לוחץ אותו כלפי מטה, לא כלפי המרכז */
  will-change:transform;
}
#splash .word{
  position:absolute;left:100%;bottom:0;   /* מחוץ לזרימה: רוחב הבמה הוא הסימן בלבד,
     ולכן הוא ממורכז כבר בציור הראשון, בלי להמתין ל-JS */
  padding-inline-start:var(--s4);white-space:nowrap;
  font:600 var(--fs-lead)/1 var(--mono);letter-spacing:2.5px;color:var(--ink);
  clip-path:inset(0 100% 0 0);   /* נחשף בדיוק במקום שהגלגל כבר עבר */
  will-change:clip-path;
}
/* המסגרת נושאת מיקום וחיתוך במערכת הצירים של המסך; התמונה שבתוכה
   מסתובבת. ככה משטח המגע נשאר אופקי גם כשהגלגל מסובב. */
#splash .wheel{
  position:absolute;left:0;top:0;width:60px;height:60px;
  will-change:transform;transform:translate(-100px,-400px);
  user-select:none;-webkit-user-drag:none;
}
/* הגלגל הוא גוף ולא מדבקה: מאחורי החישוק יושב עיגול אטום בצבע
   הרקע, ולכן החלונות שבין החישוקים לא מראים את מה שמאחור. מעל רקע
   ריק הוא בלתי נראה, וכשהגלגל עובר מול הסימן — הסימן נחסם, והעין
   קוראת שני גופים זה לפני זה במקום שתי תמונות זו על זו. */
#splash .wheel .hub{
  position:absolute;left:22.5%;top:22.5%;width:55%;height:55%;
  border-radius:50%;background:var(--bg);
}
/* חתך הקרקע נעשה בקופסה שאינה מסתובבת ואינה נמתחת: כך המשטח
   השטוח נשאר אופקי, והצמיג שמתרחב במגע לא נחתך בצדדים */
#splash .wheel .cut{position:absolute;left:-50%;top:0;width:200%;height:100%;will-change:clip-path}
#splash .wheel img{position:absolute;top:0;left:25%;width:50%;height:100%;display:block;will-change:transform}
/* הצמיג לבדו — מרכז הגלגל חתוך ממנו, ולכן אפשר למעוך אותו
   בלי לגעת בחישוק. החישוק לבדו — נשאר עגול וקשיח תמיד. */
#splash .wheel .tyre{
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 52%,#000 55%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 52%,#000 55%);
}
#splash .wheel .rim{clip-path:circle(27.5% at 50% 50%)}
/* רגע הפגיעה מצויר בקדרים של הרנדר עצמו: הגומי שם נמעך ומתנפח
   כמו במציאות. הרצועה חתוכה כך שתחתית כל תא היא קו הקרקע, ולכן
   התאים מתחלפים בלי לקפוץ. 117.5% = 168/143, יחס התא לגלגל. */
#splash .wheel .hit{
  position:absolute;left:50%;width:117.5%;height:117.5%;transform:translateX(-50%);
  background:url(/hit.webp?v=1) no-repeat;background-size:800% 100%;
  transform-origin:50% 98.214%;   /* קו הקרקע בתוך התא */
  display:none;will-change:background-position,top,transform;
}
/* הצל מונח תמיד על הרצפה ומצויר לפני הסימן, ולכן הסימן מסתיר
   אותו: זו שלולית הצל שסביב בסיסו, ולא כתם שנמרח עליו. ככל
   שהגלגל גבוה יותר הוא רחב, בהיר ורך יותר — כמו צל אמיתי. */
#splash .shade{
  position:absolute;left:0;top:0;width:60px;height:16px;border-radius:50%;
  pointer-events:none;will-change:transform,opacity;opacity:0;
  background:radial-gradient(ellipse at center,
    rgba(46,36,24,.40), rgba(46,36,24,.17) 46%, rgba(46,36,24,0) 73%);
}
/* טשטוש תנועה. בשיא הנפילה הגלגל עובר בין פריים לפריים כרבע
   מהקוטר שלו; בלי טשטוש העין רואה קפיצות, ואיתו — צילום. הטשטוש
   נפרד לשני הצירים, ולכן הוא נכון גם בנפילה וגם בנסיעה. */
#splash .mb{position:absolute;width:0;height:0;overflow:hidden}
#splash .hint{
  position:absolute;bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  font:400 var(--fs-label) var(--sans);color:var(--muted);
  opacity:0;animation:sp-fade .45s ease 3.4s forwards;  /* רק אם ההמתנה נמשכת */
}
@keyframes sp-fade{to{opacity:1}}

/* מי שביקש פחות תנועה מקבל את אותו מסך, מיד ובלי תנועה */
@media (prefers-reduced-motion: reduce){
  #splash .word{clip-path:none}
  #splash .wheel,#splash .shade{display:none}
  #splash .hint{animation:none;opacity:1}
  #splash{transition:opacity .01s}
}
</style>
</head>
<body>
<div id="app">
  <div id="splash">
    <div class="stage" id="stage">
      <span class="shade" id="spShade"></span>
      <svg class="mark" id="spMark" viewBox="71 180 496 333" aria-hidden="true">
        <path fill="#dd6612" fill-rule="evenodd" d="M72 180 L72 190 L108 365 L129 477 L134 489 L147 504 L160 511 L168 513 L468 513 L476 511 L490 503 L502 489 L507 476 L535 332 L567 182 L566 180 Z M97 202 L138 416 L166 351 L225 202 Z M412 202 L474 357 L484 378 L485 384 L497 410 L498 416 L500 415 L541 202 Z M318 245 L273 356 L270 360 L269 366 L256 394 L250 412 L247 416 L243 429 L240 433 L232 456 L224 472 L218 487 L219 489 L418 488 L399 440 L315 440 L315 436 L322 422 L339 377 L372 376 L319 245 Z"/>
      </svg>
      <span class="word" id="spWord">AUTOPARTS</span>
      <svg class="mb" aria-hidden="true"><filter id="spMB" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB"><feGaussianBlur id="spMBg" stdDeviation="0 0"/></filter></svg>
      <span class="wheel" id="spWheel" aria-hidden="true"><span class="hub"></span><span class="cut" id="spCut"><img class="tyre" id="spTyre" src="/wheel.webp?v=13" alt="" draggable="false"><img class="rim" id="spRim" src="/wheel.webp?v=13" alt="" draggable="false"></span><span class="hit" id="spHit"></span></span>
    </div>
    <span class="hint">מתחבר לשרת…</span>
  </div>
  <div id="screen" class="stack" style="flex:1;min-height:0"></div>
  <div class="dock" id="dock"></div>
</div>
<script>
  // אם משהו ישבור את הטעינה, המסך לא ייתקע — נעלם גם בלי app.js
  setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.classList.add('gone'); }, 8000);
</script>
<script src="/splash.js"></script>
<script src="/app.js"></script>
</body>
</html>
