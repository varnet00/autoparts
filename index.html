<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efece8">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="autoparts">
<!-- מסך מלא אחרי "הוסף למסך הבית"; black-translucent מותח את הרקע הקרמי
     גם מתחת לשעון, ועל ה-safe area מפצה ה-CSS למטה -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>autoparts — כל חלק. כל רכב.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='9' fill='%23f2761b'/%3E%3Cpath d='M8.6 19.4 13 8.6h2l4.4 10.8h-2.3l-1-2.6h-4.2l-1 2.6zm4-4.5h2.8L14 11.2z' fill='%2316140f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efece8; --card:#f7f5f2; --chip:#ece8e2; --ink:#16140f; --muted:#8b847b;
  --line:#e4dfd8; --hair:#d6cfc5; --orange:#f2761b;
  --orig-bg:#e2ecda; --orig-fg:#3c6a31;
  --copy-bg:#eae6df; --copy-fg:#5d574f;
  --used-bg:#fbe4cf; --used-fg:#a3560f;
  --sans:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:Rubik,Heebo,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --island:linear-gradient(165deg,#fdfcfb 0%,#e7e3dc 42%,#c9c5bd 74%,#eae6e0 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#d9dadd;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
}
#app{
  width:100%;max-width:460px;background:var(--bg);min-height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:520px){
  body{align-items:center;padding:22px 0}
  #app{height:min(880px,calc(100dvh - 44px));min-height:0;border-radius:38px;box-shadow:0 18px 44px rgba(22,20,15,.22)}
  .top{padding-top:18px}
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;flex:none;
     padding:calc(18px + env(safe-area-inset-top)) 18px 0}
.brand{display:flex;align-items:center;gap:9px;direction:ltr}
.brand b{font:600 12.5px/1 var(--mono);letter-spacing:1.6px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{background:var(--chip)}

/* ---------- прокручиваемая область ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.pad{padding:0 18px}

/* ---------- поиск ---------- */
.searchbar{background:var(--card);border-radius:999px;padding:15px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(22,20,15,.07)}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:14.5px;min-width:0}
.searchbar input::placeholder{color:var(--muted)}

/* ---------- чипы ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:var(--chip);font:500 11.5px var(--sans);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.num{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--chip);font:500 10.5px var(--mono);letter-spacing:.3px;color:#4f4941;direction:ltr}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font:500 10.5px var(--sans)}
.tag.orig{background:var(--orig-bg);color:var(--orig-fg)}
.tag.copy{background:var(--copy-bg);color:var(--copy-fg)}
.tag.used{background:var(--used-bg);color:var(--used-fg)}

/* ---------- карточки ---------- */
.card{background:var(--card);border-radius:20px;overflow:hidden}
.thumb{border-radius:14px;flex:none;background:repeating-linear-gradient(135deg,#e7e2db 0 7px,#f1eee9 7px 14px);display:flex;align-items:center;justify-content:center;font:400 8px var(--mono);color:#a9a29a;background-size:cover;background-position:center}
.price{font:600 15px var(--mono);direction:ltr}
.muted{color:var(--muted)}
.label{font:500 11px var(--sans);color:var(--muted)}
.hr{border-top:1px solid var(--line)}

/* ---------- нижний островной навбар ---------- */
.dock{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline:0;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none;z-index:20}
.island{display:flex;align-items:center;gap:4px;border-radius:999px;padding:9px 12px;background:var(--island);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 26px rgba(22,20,15,.2);pointer-events:auto}
.tab{width:42px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(22,20,15,.42)}
.tab[aria-current="page"]{background:rgba(22,20,15,.09);color:var(--ink)}
.fab{width:56px;height:56px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(22,20,15,.32);pointer-events:auto}
.fab:active{transform:scale(.95)}

/* ---------- формы ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field input,.field select,.field textarea{
  background:var(--card);border-radius:14px;padding:14px 16px;border:0;outline:none;width:100%;font-size:14px;
}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--hair)}
.field .mono{font:500 13px var(--mono);text-align:right}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:15px;text-align:center;font:500 14px var(--sans);width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--hair)}

/* ---------- чат ---------- */
.bubble{max-width:82%;padding:13px 15px;font:400 14px/1.6 var(--sans);border-radius:18px}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-end-end-radius:6px}
.bubble.them{align-self:flex-start;background:var(--card);border-end-start-radius:6px}
.time{font:400 10px var(--mono);color:#b0a9a0}

/* ---------- служебное ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 30px}
.spin{width:26px;height:26px;border:2.5px solid var(--hair);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:18px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font:500 13px var(--sans);z-index:40;box-shadow:0 10px 24px rgba(22,20,15,.3)}
.toast.err{background:#8c2f14}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
svg{flex:none}
</style>
</head>
<body>
<div id="app">
  <div id="screen" class="stack" style="flex:1;min-height:0"></div>
  <div class="dock" id="dock"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
